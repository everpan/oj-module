openapi: 3.1.0
info:
  title: notification api
  version: 0.0.0
paths:
  /notification/notifications:
    get:
      operationId: fetchNotifications
      description: 通知列表
      responses:
        "200":
          description: 成功（oj 信封：code=0）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        avatar:
                          type: string
                        date:
                          type: string
                        isRead:
                          type: boolean
                        message:
                          type: string
                        title:
                          type: string
                      required:
                        - avatar
                        - date
                        - message
                        - title
                      additionalProperties: false
        default:
          description: 业务错误（oj 信封：code 非 0，HTTP status=code）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                required:
                  - code
