# `ojm init` 拷入新工程的白名单（路径相对本 templates 根目录）。
#
# 与已废弃的 init.exclude.yaml 逻辑相反：模板里大部分文件是「模板自运行/
# demo/产物」，不该进用户工程——用排除清单会越列越长，故反转为白名单：
# 凡未列出的路径一律不拷，也不计入 init 报告的 created/skipped。四类不列入：
#  1. demo-only 演示模块——模板内置供演示，新工程默认不需要（文件缺失会崩）。
#     其 web.config.ts 条目由 `// #region demo-only` 标注，init 时整段剥离。
#  2. 模板自运行专属文件——templates 本身也是一个可 `pnpm dev` 的工程，
#     它的 package.json / node_modules / bin / lock 绝不能泄漏进用户工程；
#     package.json 由 init 现场生成（钉死真实版本，不带 workspace:/catalog:）。
#  3. 构建与运行期产物——dist/api、dist/web、logs、签发的私钥与 sqlite；
#     模板跑过 build/dev 后会留在本地，既不进用户工程，更不该让所有工程
#     共享同一把私钥。
#  4. 模板自用元数据——本清单自身。
#
# 另有两类文件「故意不进清单」：package.json / pnpm-workspace.yaml / .gitignore
# 由 init 现场生成（见 init.ts）。其中 .gitignore 是硬约束：npm/pnpm pack 会
# 剥离 `.gitignore` 点文件，收录它只会让安装包缺文件、readInitInclude fail-fast
# 把整个 init 打挂（0.2.5 发布实测）；本模板目录自带的 .gitignore 仅供模板自身
# `pnpm dev` 时忽略产物，不进发布包、也不进用户工程。守卫：
# tests/cli/release-manifest.test.ts 逐条核对清单条目落在 tarball 内。
#
# 注意 web/src/{demo,home}/__client 不在清单：其 api 模块（api/src/demo、
# api/src/home）是 demo-only 不进脚手架，client 生成物留着会指向不存在的端点，
# 故 demo/home 只列页面源码（entry/locales/pages），不列整棵模块目录。
include:
  # —— 工程级文件 ——
  - README.md
  # 本地模拟 CDN 目录：只带 README（它的存在让挂载目录不缺，站点才起得来）。
  # 产物 *.tgz / *.sig / catalog.yaml / shards/ 一律不拷、不进发布包。
  - cdn/README.md
  - tsconfig.json
  - global.d.ts
  - env.d.ts
  # 别名类型兜底（`declare module "#*"`，非模块文件）。`tsconfig.paths.json` 不在此列：
  # 它由 init 按目标工程的模块清单**现场生成**（模板兼作 demo 工程，多出的模块不该带过去）
  - types
  - web.config.ts
  - openapi.json
  - src/styles.css
  # 后端 typecheck 工程（package.json 的 typecheck:api 指向它）；只收后端、排除 web
  - src/tsconfig.json
  # —— 后端：配置 / 种子 / 测试 / 默认模块（模块源码在 src/<name>/api）——
  - config.yaml
  - .ojm-api-exempt.json
  - seed.mysql.sql
  - seed.pg.sql
  - vitest.config.ts
  # —— tests 逐条白名单（不收 tests/ 整目录）——
  # 业务工程只拷「纯 node:sqlite 夹具、零 cli 包环境假设」的测试。以下 6 个不分发
  # （oj-wiki 0.2.25 升级实踩：拷进业务工程即死文件，重跑 init 还会复活）：
  #   lifecycle/preflight・installer・market-api・steps-fs・sig-fixtures —— 硬编码
  #   oj-bin 仓夹具路径（../../src/lifecycle/__tests__/fixtures，模板树内不存在）；
  #   lifecycle/bootstrap —— 私钥红线钉测硬编码「packages/cli 全树」扫描，业务工程
  #   扫 node_modules 必超时。它们只活在 oj-module/oj-bin 的 cli 包测试语境。
  - tests/fixture.ts
  - tests/auth-ldap.spec.ts
  - tests/auth-session.spec.ts
  - tests/auth-throttle.spec.ts
  - tests/guard.spec.ts
  - tests/l1-builder.test.ts
  - tests/query-utils.spec.ts
  - tests/rbac-audit.spec.ts
  - tests/rbac-contacts.spec.ts
  - tests/rbac-guard.spec.ts
  - tests/rbac-roles.spec.ts
  - tests/rbac-seed.spec.ts
  - tests/rbac-settings.spec.ts
  - tests/rbac-solution-perms.spec.ts
  - tests/rbac-tables.spec.ts
  - tests/rbac-users.spec.ts
  - tests/seed-role-accounts.spec.ts
  - tests/lifecycle/atomic-state.spec.ts
  - tests/lifecycle/deploy-smoke.spec.ts
  - tests/lifecycle/migrate.spec.ts
  - tests/lifecycle/register.spec.ts
  - tests/lifecycle/semver.spec.ts
  - tests/lifecycle/sha384.spec.ts
  - tests/lifecycle/solutions-api.spec.ts
  - tests/lifecycle/text-edit.spec.ts
  - tests/lifecycle/tgz-guard.spec.ts
  - tests/lifecycle/trust.spec.ts
  - tests/lifecycle/uninstall.spec.ts
  - tests/lifecycle/verify-checks.spec.ts
  - tests/lifecycle/verify-report.spec.ts
  - src/_platform/api
  - src/auth/api
  - src/notification/api
  - src/personal-center/api
  - src/system/api
  - src/web/api
  # —— web 前端模块（demo/home 只列页面源码，__client 见顶部说明）——
  - src/_platform/web
  - src/auth/web
  - src/demo/web/entry.ts
  - src/demo/web/locales
  - src/demo/web/pages
  - src/home/web/entry.ts
  - src/home/web/locales
  - src/home/web/pages
  - src/login/web
  - src/notification/web
  # 解决方案市场：默认第一方能力。逐子路径收录——__tests__ 不进脚手架
  # （用户工程无 web 侧 vitest 基建，拷了是死文件）
  - src/oj-market/web/entry.ts
  - src/oj-market/web/types.ts
  - src/oj-market/web/api
  - src/oj-market/web/components
  - src/oj-market/web/hooks
  - src/oj-market/web/locales
  - src/oj-market/web/pages
  - src/oj-market/web/utils
  - src/personal-center/web
  - src/system/web
  - src/web/web
