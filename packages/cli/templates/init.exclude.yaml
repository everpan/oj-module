# `ojm init` 不拷入新工程的路径（相对本 templates 根目录）。
#
# 四类：
#  1. demo-only 模块——模板内置供演示，但新工程默认不需要（文件缺失会崩）。
#     其 web.config.ts 条目由 `// #region demo-only` 标注，init 时整段剥离。
#  2. 模板自运行专属文件——templates 本身也是一个可 `pnpm dev` 的工程，
#     它的 package.json / node_modules / bin / lock 绝不能泄漏进用户工程。
#  3. 构建与运行期产物——templates 跑过 build/dev 后本地会留下 api/dist、
#     web/dist、以及签发的私钥与 sqlite；这些既不能进用户工程，更不该让
#     所有工程共享同一把私钥。
#  4. 模板自用元数据——排除清单本身，用户工程无需知道。
exclude:
  # —— demo-only 演示模块 ——
  - api/src/demo
  - api/src/home
  - web/src/about
  - web/src/access
  - web/src/exception
  - web/src/outside
  - web/src/route-nest
  - web/src/oj-market
  # —— 模板自运行专属文件 ——
  - package.json
  - node_modules
  - bin
  - pnpm-lock.yaml
  - .DS_Store
  # —— 构建与运行期产物 ——
  - api/dist
  - api/logs
  - web/dist
  - api/config/private.pem
  - api/config/public.pem
  - api/config/cert.jws
  - api/config/secrets-private.pem
  - api/config/secrets-public.pem
  - api/db.sqlite
  - api/db.sqlite-shm
  - api/db.sqlite-wal
  # —— 模板自用元数据 ——
  - init.exclude.yaml
