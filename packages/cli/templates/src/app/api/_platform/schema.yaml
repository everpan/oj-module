# 框架级共有表上收 _platform 伪模块（§3-D2）：归属图单源，杜绝「散在模块 seed」。
# 与 manifest.tables 双向一致（S005）；auth 模块跨模块读 users 经 deps 声明。
# D10：users.roles JSON 列已移除——角色唯一权威源为 sys_user_role 关系表。
# _oj_migrations 为 oj 迁移 journal 内建表（oj 自建自管 DDL）；此处声明只为让 db.table
# 元数据校验放行（journalHeadOf：深检 ledger 复核 + P3-11 预锁 guard 的真源），列与 oj 真表逐列对齐。
tables:
  _oj_migrations:
    # 共享表（B 组）：oj 迁移 journal，跨租户唯一，不可能带租户上下文访问。
    tenant: false
    pk: [module, version]
    columns:
      module: {type: text, null: false}
      version: {type: integer, null: false}
      name: {type: text}
      applied_on: {type: text}
      checksum: {type: text}
  users:
    pk: id
    columns:
      id: {type: integer, autoincrement: true}
      # 租户维度（0015）：外部身份按租户隔离，用户名唯一性收敛到 (tenant_id, username)。
      tenant_id: {type: text, null: false}
      # 企微业务键（D3/D6）：tenant_id 是隔离判定列，corp_id 只做可读冗余，不参与判定。
      corp_id: {type: text}
      username: {type: text, null: false}
      password_hash: {type: text, null: false}
      avatar_base64: {type: text, null: false}
      source: {type: text, null: false}
      display_name: {type: text}
      must_change: {type: integer, null: false}
      is_forbidden: {type: integer, null: false}
      email: {type: text}
      phone_number: {type: text}
      description: {type: text}
      # 0016：是否登录过本站。同步会为「从未登录」的全员建档，contacts 只返回 activated=1，
      # 否则任何登录账号都能以 60 次/分把整份企业名册拖走（方案 §9.1）。存量行迁移时置 1。
      activated: {type: integer, null: false}
      # 职务（与来源无关的通用字段）
      position: {type: text}
      # 工号（0017，可空）：与姓名/用户名分开的独立工号列，租户内有值时唯一。
      # 必须在这里声明——列只落库而不进白名单时，任何模块 select 它都会被构造器拒为
      # `unknown column 'employee_no'`（/system/departments 依赖 /system/users 的选人列表，
      # 曾因此在打开部门页时整页报错）。
      employee_no: {type: text}
      # 外部源侧的状态快照（企微 1/2/4/5）。**绝不**自动改写 is_forbidden——那会和
      # 本站管理员的手动启停互相覆盖（方案 §4.3）
      external_status: {type: integer}
  sys_setting:
    # 共享表（B 组 D8）：登录方式发现 /system/login-methods 是未登录端点，此刻没有租户上下文；
    # 且这些开关是部署级语义，不是每 corp 语义。
    tenant: false
    pk: key
    columns:
      key: {type: text, null: false}
      module: {type: text, null: false}
      group: {type: text, null: false}
      type: {type: text, null: false}
      value: {type: text}
      default_value: {type: text}
      label_key: {type: text}
      group_label_key: {type: text}
      options: {type: text}
      secret: {type: integer, null: false}
      deprecated: {type: integer, null: false}
      update_time: {type: integer, null: false}
  sys_oplog:
    pk: id
    columns:
      id: {type: integer, autoincrement: true}
      tenant_id: {type: text, null: false}
      create_time: {type: integer, null: false}
      user_id: {type: integer, null: false}
      username: {type: text, null: false}
      action: {type: text, null: false}
      module: {type: text, null: false}
      version: {type: text}
      target: {type: text}
      detail: {type: text}
      level: {type: integer, null: false}
  sys_solution_route:
    # 共享表（B 组）：站点级路由/启用注册表（PK=path，安装/卸载/启停为站点操作），
    # 语义上不存在按 corp 分叉，也不保证在租户上下文里被访问。
    tenant: false
    # 0010 重构后形状（站点级路由，path 主键；与 migrations/0010__sys_solution_route.sql 逐列一致）。
    pk: path
    columns:
      path: {type: text, null: false}
      module: {type: text, null: false}
      category: {type: text, null: false}
      order: {type: integer, null: false}
      title_key: {type: text}
      required_permission: {type: text}
      deprecated: {type: integer, null: false}
      enabled: {type: integer, null: false}
  sys_role:
    # 共享表（B 组）：框架角色目录（内置角色 + 权限码由模块声明同步而来），分配关系在 A 组。
    tenant: false
    pk: name
    columns:
      name: {type: text, null: false}
      module: {type: text, null: false}
      title: {type: text}
      # 原始 i18n key（R2，0018）：title = 安装期解析文本，本列存原文供 UI 实时翻译（sys_permission 先例）
      title_key: {type: text}
      description: {type: text}
      builtin: {type: integer, null: false}
      deprecated: {type: integer, null: false}
  sys_permission:
    tenant: false
    pk: code
    columns:
      code: {type: text, null: false}
      module: {type: text, null: false}
      title_key: {type: text}
      deprecated: {type: integer, null: false}
  sys_role_permission:
    tenant: false
    pk: [role_name, permission_code]
    columns:
      role_name: {type: text, null: false}
      permission_code: {type: text, null: false}
  sys_user_role:
    pk: [user_id, role_name]
    columns:
      tenant_id: {type: text, null: false}
      user_id: {type: integer, null: false}
      role_name: {type: text, null: false}
  sys_refresh_token:
    pk: token_hash
    columns:
      tenant_id: {type: text, null: false}
      token_hash: {type: text, null: false}
      user_id: {type: integer, null: false}
      expires_at: {type: integer, null: false}
      revoked: {type: integer, null: false}
      created_at: {type: integer, null: false}
  # 限速/登录节流状态表（V9__sys_throttle 经迁移创建；rate.ts 经 db.table() 访问，
  # 须在此声明 + 在 manifest.yaml tables 登记，否则 oj 表元数据校验报 unknown table）。
  sys_rate_window:
    # 共享表（B 组）：限速窗口按调用面计数（IP/账号维度），登录前就要用，无租户上下文。
    tenant: false
    pk: rate_key
    columns:
      rate_key: {type: text, null: false}
      window_start: {type: integer, null: false}
      count: {type: integer, null: false}
  sys_login_throttle:
    tenant: false
    pk: pair_key
    columns:
      pair_key: {type: text, null: false}
      fail_count: {type: integer, null: false}
      blocked_until: {type: integer, null: false}
  # 市场操作历史（P4 上收 _platform）：install/enable/disable/uninstall/upgrade/rollback 六类动作留痕。
  # 写入由平台编排面（_lifecycle/history.ts recordHistory）落到本表；市场页只读消费。
  market_history:
    # 共享表（B 组）：解决方案安装/升级/回滚是**站点级**操作（装一次全站生效），
    # 按租户隔离会把同一批站点事件割裂成互不可见的碎片。
    tenant: false
    pk: id
    columns:
      id: {type: integer, autoincrement: true}
      solution: {type: text, null: false}
      version: {type: text, null: false}
      action: {type: text, null: false}
      status: {type: text, null: false}
      operator: {type: text}
      message: {type: text}
      created_at: {type: integer, null: false}
  # 发布历史（2026-11-05）：签名索引里出现过的每个 product@version 一行。
  # 站点读发布历史时从索引同步（只补新行），published_at 首次写定后不改。
  market_release:
    # 共享表（B 组）：CDN 是站点级的，按租户隔离会把同一份市场索引割裂成互不可见的碎片。
    tenant: false
    pk: id
    columns:
      id: {type: integer, autoincrement: true}
      product: {type: text, null: false}
      version: {type: text, null: false}
      key_id: {type: text}
      sha256: {type: text}
      size: {type: integer}
      published_at: {type: integer, null: false}
      # file = 分发包 Last-Modified（真正的落 CDN 时刻）；index = 索引 issued_at 兜底
      published_at_source: {type: text, null: false}
      yanked: {type: integer, null: false}
      first_seen_at: {type: integer, null: false}
      # v4 DB 目录化（0003 扩列）：签名推送直写的目录真源——签名三字段 + 包内嵌 manifest
      # 抽取物。旧行（syncReleases 时代）此四列 = NULL，由站点侧扫描回填命令补齐（计划 §六）。
      sig_alg: {type: text}
      sig_value: {type: text}
      sig_public_key: {type: text}
      # A5 增补：包级 canonical 首段（签发方 registry 身份）——install verify 重构规范串用
      sig_registry_id: {type: text}
      manifest: {type: text}
  # ---- 0016：组织架构领域（CRUD 基线 + 外部源适配器的落点）----
  # 定位（方案 §14）：CRUD 是基线，企微 / LDAP 只是适配器 → 表里不出现任何 wecom_* / ldap_* 字段。
  # origin 是**归属权**标识（D13）：local = 本站管理员全权；wecom/ldap/sso = 该适配器管辖，
  # 同步与回收只作用于自己 origin 的行，绝不碰别的（否则本地建的部门会被同步干掉）。
  sys_department:
    # 租户表：组织架构天然按租户隔离（企微部署下 tenant_id = corp_id），
    # 只在有租户上下文时被读写，与 users / sys_oplog 同组（0015 A 组口径）。
    pk: id
    columns:
      id: {type: integer, autoincrement: true}
      tenant_id: {type: text, null: false}
      origin: {type: text, null: false}
      # 外部源主键（企微部门 id / LDAP entryUUID）；origin='local' 时由应用层生成稳定串
      origin_id: {type: text, null: false}
      # 本地父部门 id（不是外部 id）：本地部门与同步部门可混挂，且不随外部调整而变
      parent_id: {type: integer}
      # 未获权限时为 NULL（企微代开发未授权「部门名」即如此），展示层用 origin_id 兜底
      name: {type: text}
      name_en: {type: text}
      order_no: {type: integer, null: false}
      # 同步可见性，**仅由同步轮次维护**（失去可见范围 → 0）；本地部门恒 1
      sync_visible: {type: integer, null: false}
      # 软删除。只由外部源的删除事件置 1（D9）：本地删除走真删
      deleted: {type: integer, null: false}
      # 最近一次完整全量命中的 job（墓碑回收前必先校验本轮完整且无 skip）
      seen_job_id: {type: integer}
      update_time: {type: integer, null: false}
  # 成员 ↔ 部门（多对多）：企微一人可在多个部门，order_no / is_leader 与 department[] 逐位对应。
  # 全本地 id 关联，**与来源完全无关**——接任何适配器都不用动这张表。
  sys_dept_member:
    pk: id
    columns:
      id: {type: integer, autoincrement: true}
      tenant_id: {type: text, null: false}
      user_id: {type: integer, null: false}
      dept_id: {type: integer, null: false}
      order_no: {type: integer, null: false}
      is_leader: {type: integer, null: false}
      is_main: {type: integer, null: false}
      update_time: {type: integer, null: false}
  # ---- 0007：MCP 机器人凭据三表（mcp-bot-guide.md / api-manual §14，oj v0.1.130）----
  # 列名即契约：oj serve 的 SvcGate（dispatch.rs）静态 SQL 直查 oj_svc_token.jti——
  # 改列必须三处同步（migrations/0007 / 本文件 / 消费端 _shared/service/domain/bot.ts）。
  # 三表都是共享表（tenant:false，且 config.yaml tenant.shared_allow 双声明）：
  # svc 凭据是部署级、绑定是平台↔本系统用户的全局映射、审计按站点归口，都不该按租户割裂。
  oj_svc_token:
    tenant: false
    pk: jti
    columns:
      jti: {type: text, null: false}
      name: {type: text, null: false}
      scopes: {type: text, null: false}
      created_by: {type: text, null: false}
      created_at: {type: integer, null: false}
  oj_bot_binding:
    tenant: false
    pk: [provider, external_sub]
    columns:
      provider: {type: text, null: false}
      external_sub: {type: text, null: false}
      user_id: {type: text, null: false}
      last_used_at: {type: integer, null: false}
      created_by: {type: text, null: false}
      created_at: {type: integer, null: false}
  oj_obo_audit:
    tenant: false
    pk: id
    columns:
      id: {type: integer, autoincrement: true}
      svc: {type: text, null: false}
      provider: {type: text, null: false}
      external_sub: {type: text, null: false}
      user_id: {type: text, null: false}
      ok: {type: integer, null: false}
      reason: {type: text, null: false}
      ts: {type: integer, null: false}
