name: _platform
desc: 平台内核（非业务模块、无自身业务路由前缀）。含三类：① 跨模块服务 _shared/service（infra 基础设施 + domain 管理域）；② 生命周期引擎 _lifecycle（方案安装/卸载/注册/验签/信任状态机）；③ 平台编排 API 面 /api/_platform/{contacts,solutions}（由 contacts/api.ts、solutions/api.ts 暴露，全 superadmin 门禁）。市场域 api（市场目录/发布推送/方案生命周期编排/信任库）自 v4 起归 oj-market 模块（src/oj-market/api/，路由 /api/oj-market/*，deps 声明依赖本内核）。运行时安装的方案包不在此树。
version: 0.1.0
tables:
  - _oj_migrations
  - users
  - sys_setting
  - sys_oplog
  - sys_solution_route
  - sys_role
  - sys_permission
  - sys_role_permission
  - sys_user_role
  - sys_refresh_token
  - market_history
  - market_release
  - sys_rate_window
  - sys_login_throttle
  # 0016 组织架构领域（CRUD 基线 + 外部源适配器的落点；两张都是租户表）
  - sys_department
  - sys_dept_member
  # 0007 MCP 机器人凭据三表（租户表，带 tenant_id；oj serve SvcGate 直查 oj_svc_token.jti）
  - oj_svc_token
  - oj_bot_binding
  - oj_obo_audit
