# oj-market 第一方方案包契约（Phase B T1，20261106-2122 首包 0.2.0；2026-11-07 布局定稿升 0.2.1）。
# 市场 UI 以**纯 web 方案包**形态随站分发：包内只有 manifest + web/ 产物——
# api 编排面（install/catalog/yank/trust 推送，src/oj-market/api）留在平台内置不随包，
# 市场未装/已卸载时安装编排端点仍在（方案 §2「安装入口（市场外）」）；
# 无 DB 迁移（catalog/release 等表属平台，不随包）。
# R29 红线随包：第一方专用，第三方方案不得仿照 /api/oj-market/* 调用面（包 README 同标注）。
name: oj-market
version: 0.2.6
title: 方案市场
summary: 官方 方案市场 UI——方案清单/发布管理/发布历史（第一方专用，R29）
description: 第一方专用方案包（R29 红线）：第三方方案不得仿照 /api/oj-market/* 调用面。api 编排面（install/catalog/yank/trust）随站点脚手架内置，本包仅承载市场 UI（纯 web，无 DB 迁移）。出厂未装：superadmin 经 system 域「方案安装」首装；ojm init --yes 落位的随站 bundle 由首个市场编排请求自动收敛（上拉不下拉）。
changelog:
  - 0.2.0 Phase B 首包：市场 UI 模块化随站分发（出厂未装，superadmin 经 system 域首装）
  - 0.2.1 卡片布局定稿：恢复 340px 列宽、动作区移除详情按钮（5 枚按钮一行、无横向滚动条）、卡片正文点击进入详情
  - 0.2.2 安装/升级/回滚完成后明确提示「刷新页面以加载新菜单」（修复 SPA 一次性读 modules.json 导致新方案菜单不出现的断路口）
  - 0.2.3 危险操作二次确认补齐（部门转本地维护、企微取消同步）；市场自身卡片「卸载」永久禁用（与「停用」同口径）并加文案
  - 0.2.6 发布管理「信任审核」区非 superadmin 整区隐藏（含权限未定的加载中，不再闪现标题+forbidden 报错）；状态提取兼容生成 client 的信封 code 形态
  - 0.2.5 发布管理页新增「离线包上传」：superadmin 成对收包入库（tgz+.sig 配对验签，未审指纹如实提示，信任判定在安装 TOFU）；内网/气隙交付不走签名推送的替代通道
  - 0.2.4 操作历史记录安装失败明细（阶段 + 原始报错，脱敏落表）并按结果显示标记；支持删除安装未成功的版本（失败/待确认信任/已取消），回滚候选只认安装成功版本
