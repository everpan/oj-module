# oj-market 第一方方案包契约（Phase B T1，20261106-2122 首包 0.2.0；2026-11-07 布局定稿升 0.2.1）。
# 市场 UI 以**纯 web 方案包**形态随站分发：包内只有 manifest + web/ 产物——
# api 编排面（install/catalog/yank/trust 推送，src/oj-market/api）留在平台内置不随包，
# 市场未装/已卸载时安装编排端点仍在（方案 §2「安装入口（市场外）」）；
# 无 DB 迁移（catalog/release 等表属平台，不随包）。
# R29 红线随包：第一方专用，第三方方案不得仿照 /api/oj-market/* 调用面（包 README 同标注）。
