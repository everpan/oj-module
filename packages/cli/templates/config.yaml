# oj 服务配置（字段手册见 devkit oj-api-dev / oj --help）。由 ojm init 生成，相对路径相对本文件所在目录。

# ---- 证书三件套在 ./config/（init 已现场签发）----
#   private.pem  签发私钥：只用于给 cert.jws 签名，oj 不读它；泄露或丢失就重签一套，旧的作废
#   public.pem   oj 启动时验 cert.jws 签名用（server.public_key_path）
#   cert.jws     启动闸门：缺失/过期/签名不符直接拒启，无 config/CLI 绕过（默认 10 年有效期）
# 另有一对 secrets-*.pem：init 密封 jwt_secret 后追加到本文件末尾，同样只放部署机。

# 站点挂载：一行 = 一个 URL 前缀 + 一个目录（api/web 二选一）。
# 这里不放 api 挂载是有意的：本工程是 src/<name>/{api,web} 布局，源码由 ojm dev
# 以 --module-root src 供给、产物由 ojm preview 以 --api-path dist/api 供给，都不走 mounts。
# 手写部署（不用 ojm）时才需要加回一条 `- prefix: /api` + `api: dist/api`。
# 注意：手写部署同时要把下面 platform.root 从 `src` 改成 `dist/api`（二者必须同源），
# 否则 oj serve 报 `platform.root must be mounted as an api mount`。
mounts:
  # 本地市场 CDN：直出工程根 cdn/。seed 里 framework.market_cdn_url 缺省就是 /cdn，本站点自供免 setup。
  # 生产删掉这条，并把该设置指向真 CDN（绝对地址）。不能设 spa：缺文件必须 404，
  # 回落 index.html 会让市场解析崩。
  - prefix: /cdn
    web: ./cdn
    # 读面缓存 60s：yank 最坏 120s 生效。304 由 oj 静态层自带，这里只管新鲜窗口。
    headers:
      Cache-Control: 'max-age=60, stale-while-revalidate=60'
  # 生产要 oj 直出前端（前后端同端口的 SPA，即 ojm preview 形态）就解开下面三行，先 ojm build。
  # preview 自己会注入等价挂载，平时不用动。
  # - prefix: "/"
  #   web: "./dist/web"   # 相对本文件 → 工程根/dist/web
  #   spa: true

server:
  host: 127.0.0.1 # 钉死 127.0.0.1：oj 默认绑 [::1]，localhost 在反代下解析有坑
  port: 9778
  public_key_path: ./config/public.pem
  certificate_path: ./config/cert.jws
  migrate_on_start: auto # auto=启动即迁移；release 建议 verify（账本落后拒启，先 oj migrate）
  schema_validation: true # 契约 .schema 违反即 400；仅当 .schema 与旧 handler 冲突时临时关
  js_heap_limit_bytes: 268435456 # 单 isolate 堆限额（默认 256MiB，下限 32MiB）
  route_timeouts: [] # 路由级超时；pattern 按声明序首个命中，写含 base 的全路径
  response_headers: {} # 统一响应头
  # 热更端点 /ojm:reload：安装器的 reloading 段要用，关掉安装会失败。
  # 下面这行是**安装器的文本锚点**（ensureReloadApi 在锚点行下插回 reload_api: true）：
  # 整行必须逐字等于 `# ojm:reload`，不要删、不要加尾注。
  # ojm:reload
  reload_api: true
  blob_upload_max_bytes: 1073741824 # PUT blob 单文件上限（默认 1GiB；与 multipart 的 10MB 是两道闸）
  cors:
    origins: [] # 空 = 放行任意源；要带凭据必须列具体源
    credentials: false
db:
  default: 'sqlite://db.sqlite' # 相对 config 目录；缺文件自动建空库

vars:
  # 站点对外地址。装方案时服务端拿它把 /cdn 这类相对地址补全成绝对 URL（深检探针也用它）。
  # 故意不读请求头 Host（防伪造 Host 牵引出站）：不配 = fail-closed，不会替你猜。
  # canonical_origin: "https://your-site.example.com"

  # ---- 企业微信（部署级常量，不进 DB）----
  # 两种应用来源，**可同时启用**（docs/plans/20261101-2044-wecom-internal-app-plan.md）：
  #   · 代开发（suite）：一套代开发模板，企业扫码授权即接入，一套部署可服务多家企业；
  #   · 企业内部应用 / 自建应用（corp）：企业自建应用，一套部署只服务一家企业。
  # 两套的企业侧数据链路相同（permanent_code 就是当 corpsecret 用的），差别只在凭据来源与回调。
  # 从代开发迁到自建时请把旧的 suite 变量清空；两套同时生效须显式开 wecom_allow_coexist。
  # 一个部署 = 一个服务商账号下的一套代开发模板（或一家企业的自建应用），所以这些值是「部署」维度，不进 DB。
  # 「哪个企业装了哪个应用」不写在这里：企微 create_auth 回调推 AuthCode → 换永久授权码 →
  # 落 wecom_app_profile（主键含 agent_id，同一企业测试/正式两个应用天然并存），
  # 新增企业只需企业管理员扫码授权，**不改配置、不重启**。
  # 分三层（来源与必填时序不同，破解「先有 suite 还是先有回调」死锁）：
  #   · Tier A 本地生成、创建模版前即可配齐：callback_token / encoding_aes_key / enc_key / base_url；
  #     任一为空 → 启动即 400 拒绝服务（宁可不登录，也不明文存 permanent_code）。
  #   · Tier B 企微创建模版后下发：suite_id / suite_secret；为空时仍可启动并响应 echostr 验证，
  #     仅 login/callback/create_auth 等 suite 流程会 400——先配 Tier A 跑通回调、建模版、拿 suite 再补全。
  #   · Tier C 服务商后台「通用开发参数」页拿（不是企业、也不是 suite）：provider_id / provider_secret；
  #     只供「生成授权链接」用（get_customized_auth_url 要 provider_access_token）。缺它不影响登录，
  #     但 /system/wecom 点「生成开通链接」会 400 点名缺这两项。
  #   wecom_suite_id          代开发应用「模板详情 → 基本信息」页里的「模板ID」（即 SuiteID）；创建模板成功后才出现
  #   wecom_suite_secret      同页「模板Secret」（即 SuiteSecret，可重置）；不是企业 CorpID/CorpSecret
  #   wecom_provider_id       服务商的 corpid（服务商自己的，不是企业 corpid）；**位置：服务商后台「服务商信息」页显示的 CorpID**
  #   wecom_provider_secret   服务商 provider_secret；**位置：服务商后台 → 应用管理 → 通用开发参数（点「编辑」）→ ProviderSecret 字段**，
  #                           **不在「服务商信息」页**（那里只显示 CorpID），也**不是** suite_secret（suite 那个是另一套）。
  #   wecom_callback_token    代开发「指令回调」的 Token（回调验签用）
  #   wecom_encoding_aes_key  代开发「指令回调」的 EncodingAESKey（43 字符，回调解密用）
  #   wecom_enc_key           permanent_code / 应用 Secret 的落库加密密钥（hex/base64，16 或 32 字节；建议 oj secret keygen）
  #   wecom_base_url          连接器基址（绝对地址，无尾斜杠，**这是基址、不是回调 URL**），如 https://site.example.com/api/auth/wecom
  #                           → 回调 URL 填 <base>/event（必须带 /event，裸 <base> 无 handler 会 404）；
  #                             网页授权 redirect_uri 用 <base>/callback
  #
  # 企业内部应用（corp）——一套部署一家企业：
  #   wecom_corp_id                 企微后台「我的企业 → 企业信息 → 企业ID」；同时是租户键
  #   wecom_corp_secret             应用详情页「Secret」；**换过后必须到 /system/wecom 重新「验证并接入」**
  #   wecom_corp_agent_id           应用详情页「AgentId」
  #   wecom_corp_callback_token     「管理工具 → 通讯录同步 → 接收事件服务器」的 Token（可选；不配 = 不做事件增量）
  #   wecom_corp_encoding_aes_key   同上 → EncodingAESKey（可选）
  #   ⚠ 自建应用**收不到**成员通讯录变更事件（官方 90970），事件增量只能靠上面这组「通讯录同步」回调，
  #     且企微要求该 URL 在企业主体域名下——所以它只适用于私有化单企业部署。
  #
  #   wecom_allow_coexist  两套凭据都配齐时必须显式写 'true' 才允许共存（否则 fail-fast）
  wecom_suite_id: ''
  wecom_suite_secret: ''
  wecom_provider_id: ''
  wecom_provider_secret: ''
  wecom_callback_token: ''
  wecom_encoding_aes_key: ''
  wecom_corp_id: ''
  wecom_corp_secret: ''
  wecom_corp_agent_id: ''
  wecom_corp_callback_token: ''
  wecom_corp_encoding_aes_key: ''
  wecom_allow_coexist: ''
  wecom_enc_key: ''
  wecom_base_url: ''

platform:
  # 安装器热更 config 需要 platform 特权（reloadConfig/信任库写面）；编排面自 Phase B 起在
  # oj-market 模块（/api/oj-market/*），与 _platform 同权——缺 oj-market 时装到 reloading
  # 段 NotCapable（2026-11-07 市场线演练实锤）。
  modules: [_platform, oj-market]
  root: src # 后端模块源码根（src/<name>/api 的父目录）；preview 派生 config 时改写成 dist
  # ⚠️ 手写部署（不用 ojm，靠 mounts 起站）时：root 必须等于 api 挂载目录，
  # 否则 oj serve 直接拒启 `platform.root (…) must be mounted as an api mount`。
  # 编译产物下把这里改成 `dist/api`（与下面 `- prefix: /api  api: dist/api` 同源）。
  # ojm dev/preview 不受影响：dev 用 --module-root、preview 派生 config 会重写 root。
  # 信任库默认落在安装子树之外（.solutions/trusted-keys.yaml），第三方方案模块碰不到。
  # U6 加固：第三方模块的 fs 读写范围 = fs.root（= modules/ 安装子树），信任库必须在其外，
  # 否则方案包可写自己的信任锚（伪造签名来源）。部署侧还应补 platform.trusted_paths 授权
  # _platform 写库、并把第三方模块 fs.root 收窄到各自安装子树。
  # 下面三条命令与安装器逐字对齐（含每个空格），一个 token 都不能动：
  exec:
    _platform:
      allow: &INSTALLER_EXEC_ALLOW
        - 'tar -tvzf ${path:archive}'
        - 'tar -xzf ${path:archive} -C ${path:dest}'
        - 'oj migrate --format json -d ${path:dir} ${raw:module}'
    # 市场编排面（src/oj-market/api，端点在 /api/oj-market/*）与 _platform 用同一安装器，
    # 请求模块上下文 = oj-market（oj exec 按模块逐条授权）——缺这条真机安装/收敛全 NotCapable。
    oj-market:
      allow: *INSTALLER_EXEC_ALLOW

# 安装器落盘面：解包到 modules/.staging、写 dist/modules、备份 db.sqlite，全在 config 目录内。
# 缺这段会 NotCapable，且症状很阴：安装提交返回 200，但 task 查询恒 404。
fs:
  root: .
  readonly: false

# LDAP 连接段：解开注释填值即接通目录服务；字段映射在「系统设置 → LDAP」里配，改本段要重启。
# oj 严格解析这段，只写下面这些键，多一个键启动 fail-fast。
# ldap:
#  url: "ldap://127.0.0.1:389"
#  bind_dn: ""
#  bind_pw: ""
#  timeout_ms: 3000
#  start_tls: false
#  tls_skip_verify: false

auth:
  jwt_secret: __JWT_SECRET__ # init 随机生成；生产必须更换
  access_token_duration: 2h
  refresh_token_duration: 720h
  anonymous_paths: # 不带 token 也能访问的路径；漏列则未登录访问一律 401
    - /auth/login
    - /auth/ldap-login # LDAP 目录登录
    - /auth/refresh
    - /auth/logout
    - /system/login-methods # 登录页「登录方式」Tabs 的数据源，未登录就要能读
    - /auth/wecom/login # 企微授权入口：跳转前必然未登录
    - /auth/wecom/callback # 企微 302 回跳：code 即凭证，此时还没有本地会话
    - /auth/wecom/ticket # 一次性票据换 TokenBundle：票据本身就是「刚验过的登录证明」
    - /auth/wecom/event # 企微指令回调：靠 msg_signature 验签，不走 Bearer
    - /publish/credential/exchange # 凭证换发布身份：凭证自身即持有型证明，CLI 可能没有账号密码
    # —— 方案市场匿名面（v4 §五：签名制不经账号口令，企微用户无障碍）——
    # catalog 匿名读：站点身份发现面（registry_id）+ CLI 2×2 兼容矩阵探测（旧站点无此 API → 404 → 人话）
    # cdn/upload 签名推送：X-OJM-Key-Id / X-OJM-Signature 即凭证（信任库 + Ed25519），不经 Bearer
    # yank 签名下线：同凭证制——漏列则 oj-auth 守卫在 handler 前硬 401，签名永无到达之日（终审 C1 修补）
    # `**` 跨段（≥0 段，oj-auth v0.1.20 语义）：一条同盖 catalog 与 catalog/detail
    # 生效口径：config.yaml 启动冻结段，改后须重启（restart_pending）
    - /oj-market/catalog/**
    - /oj-market/cdn/upload
    - /oj-market/yank

# 多租户（企微代开发 v3 Phase 0）：开启后所有 {base} 请求必须带 X-TENANT-ID，否则 400。
# 前端由 tenantStore + headerProvider 统一注入（单租户部署恒为 default，UX 不变）。
tenant:
  enable: true
  header_key: X-TENANT-ID
  sql_guard: deny # 构造器查询自动注入 tenant_id；裸 SQL 漏写/绑错租户直接拒
  allow_as_tenant: true # 企微 302 回调（浏览器带不了自定义头）用 db.asTenant(服务端推导值) 补身份
  # 共享表白名单：schema.yaml 里 tenant: false 的表必须在此再列一次，双声明才豁免守卫。
  # 只放全局映射/凭证/框架目录，不放租户业务数据。
  shared_allow:
    - _oj_migrations # oj 迁移 journal（自建自管）
    - sys_setting # 登录方式发现是未登录端点，此刻无租户上下文（D8）
    - sys_solution_route # 站点级路由/启用注册表（安装是站点操作）
    - sys_role # 框架角色目录
    - sys_permission # 权限码目录
    - sys_role_permission # 角色→权限映射（同上，分配关系在 sys_user_role）
    - sys_rate_window # 限速窗口（登录前就要用）
    - sys_login_throttle # 登录节流（登录前就要用）
    - market_history # 解决方案安装/升级/回滚是站点级留痕
    - market_release # 发布历史：CDN 是站点级的，历史按站点归口
    - wecom_app_profile # 企微 corp→租户映射权威：查它时必然还没有租户上下文（D9）
    - wecom_suite_ticket # 套件级凭证，按 suite_id 全局唯一
    - wecom_login_ticket # 一次性登录票据：跨「匿名 302 回跳」与「已认证换取」两段
    - publish_credential # 发布凭证：CLI 兑换那一跳没有业务租户语义，归属走 owner_tenant 列
  # 豁免缺租户头的路径（去 base 前缀后的形态）。与 auth.anonymous_paths 同语义，
  # 但这是「没有租户头也不 400」的逃生口，只给**真的拿不到头**的端点。
  # 登录类端点不在此列：前端 headerProvider 每请求都注头（单租户恒 default），
  # 少了头应当直接 400 `missing tenant header`，而不是落进匿名态后被 sql_guard 兜成 500。
  # `/auth/wecom/**` 是例外：企微回调与 302 回跳由浏览器发起，带不了自定义头，
  # 租户只能由服务端从 profile/票据推导（db.asTenant，见 store.ts::ensureTenant）。
  anonymous_paths:
    - /system/login-methods # 登录方式发现：读共享表 sys_setting，天然无租户语义
    - /auth/wecom/login # 发起授权：此时还没有任何身份
    - /auth/wecom/callback # 企微 302 回跳：浏览器带不了头，租户由 state→profile 推导
    - /auth/wecom/ticket # 一次性票据换会话：租户由票据行携带
    - /auth/wecom/event # 企微指令回调：验签+解密即认证，无租户语义
    - /publish/credential/exchange # 凭证兑换：CLI 的裸 fetch 不带租户头；表本身是共享表（B 组）
    # 市场匿名面同列（CLI 推送/下线/发现的裸 fetch 不带租户头；与 auth.anonymous_paths 同条目）
    - /oj-market/catalog/**
    - /oj-market/cdn/upload
    - /oj-market/yank
  # tenant.require_signed_claim：租户头的服务端绑定（平台级 fail-closed）。
  # 暂保持 false——上游 oj 的 jwt.sign 目前会静默丢弃自定义 claim（需求 R6），
  # 开启前无法把 tenant 放进 token。R6 落地后改 true，裸头即失去自证能力。
  require_signed_claim: false
