# oj 服务配置（字段语义见 oj 后端开发手册 oj-api-dev / 或 oj --help）。
# 本文件由 ojm init 生成；config 内相对路径相对本文件所在目录。
# 更多能力见手册 §10：vars / broker / tasks / oidc / ws / html_meta / secrets。
#
# ---- 证书与密钥的唯一落点：`./config/`（= 工程根/config/，本文件同级的子目录）----
# 三件套由 `ojm init` 现场签发（dev 缺证时 `ojm dev` 也会补签），逐把的作用与后果：
#
#   ① private.pem —— 证书签发私钥（RSA 2048）。只用来给 ③ 签名，**oj 不读它**，
#      也绝不出部署机、不入仓。丢了不需要恢复：重新签发一套即可（旧的 ③ 作废）。
#   ② public.pem  —— 与 ① 成对的公钥，oj 启动时拿它验 ③ 的 RS256 签名。
#      配错路径或与 ③ 不是同一对 → oj 验签失败、启动即拒（读作「证书无效」）。
#      由 server.public_key_path 引用。
#   ③ cert.jws    —— JWS 证书（RS256 紧凑三段，payload 仅 nbf/exp），**oj 的启动闸门**：
#      缺失、过期、签名对不上 → fail-fast 拒启，devkit 手册明确**无任何 config/CLI 绕过开关**。
#      默认有效期 3650 天（短有效期等于定时炸弹）；过期只能重新签发一套 ①②③。
#      由 server.certificate_path 引用。
#
# 另有一对与上面无关的密钥（jwt_secret 密封用，init 密封成功后追加到本文件末尾）：
#   secrets.private_key_path  ./config/secrets-private.pem  解 jwt_secret 密文的私钥，只放部署机
#   secrets.public_key_path   ./config/secrets-public.pem   加密用的公钥，可随代码分发
#   （密文形如 ENC 后跟方括号包裹的字串；未密封时 config 里是 32 字节十六进制明文）
#
# ojm 侧的解析入口是 `resolveCertDir()`，由本文件位置派生；改落点只需动那一处 + 本段注释。

# 站点挂载（oj v0.1.58 起顶层扁平表：一行=一个 URL 前缀+一个目录，api/web 恰好其一）。
# 被删除的 server.api_prefix / app_spa_fallback 已由 mounts 取代；
# ojm dev 的 SPA 深链回落由 ojm 自建静态层负责；ojm preview 为单服务形态，
# 现场生成派生 config（.ojm-preview.yaml，注入下面的 web 挂载 + spa: true），无需手改。
#
# **这里没有 api 挂载是有意的**：本工程是 `src/<name>/{api,web}` 布局，模块分散在
# `src/<name>/api` 下，而 mounts 的 api 项按 `<目录>/<模块>/manifest.yaml` 单层解析、
# 不会递归（实测报 `module 'x' missing manifest.yaml`）。源码形态由 `ojm dev` 用
# `--module-root src` 供给，产物形态由 `ojm preview` 用 `--api-path api/dist` 供给；
# 两者与 mounts 的 api 项同时出现还会报「module declared in multiple places」。
# 手写部署（不经 ojm）时才需要自己加回一条 `- prefix: /api` + `api: dist`。
mounts:
  # 本地模拟 CDN：直出工程根 cdn/（内容见 cdn/README.md）。
  # 红线：生产请删掉这一条挂载，并把 system 设置 framework.market_cdn_url 指向真 CDN。
  # 不得给此挂载设 spa——缺文件必须返回 404，回落 index.html 会让市场解析崩。
  - prefix: /cdn
    web: ./cdn
  # 生产若由 oj 直出前端（前后端同进程，即 ojm preview 的生产形态），
  # 取消下一行注释并先 build 出 web/dist（preview 会自动注入等价挂载，无需手改）：
  # - prefix: "/"
  #   web: "./web/dist"   # 相对 config.yaml → 工程根/web/dist
  #   spa: true
  # 嵌套 handler 组（oj v0.1.64）无需配置开关，组织方式见 api.ts 顶部注释。

server:
  host: 127.0.0.1 # 显式钉死：oj 默认绑 [::1]，localhost 解析序在反代下有坑
  port: 9778
  public_key_path: ./config/public.pem
  certificate_path: ./config/cert.jws
  # ---- 迁移门禁 ----
  # auto = dev 缺省（启动即应用）；release 缺省是 verify（账本落后拒启，先 oj migrate）。
  # 显式写出来：dev 的隐式 DB 副作用不再靠「模式默认值」猜，release 也不会因缺省拒启。
  migrate_on_start: auto
  # ---- 入参契约（v0.1.44）----
  # 契约生成的 .schema 在此生效：违反即 400 且 handler 不执行。
  # 关掉等于退回「后端零校验」，仅在 .schema 与旧 handler 冲突时临时逃生。
  schema_validation: true
  # ---- 单 isolate 堆限额（v0.1.40，默认 256MiB，下限 32MiB）----
  js_heap_limit_bytes: 268435456
  # ---- 路由级超时（v0.1.30）：pattern 按声明序首个命中，且是含 base 的全路径 ----
  route_timeouts: []
  # ---- 统一响应头（v0.1.30）----
  response_headers: {}
  # ---- 热更端点（ojm install 的 reloading 段消费；显式关闭 = 安装器 reloading 段可读失败）----
  # ojm:reload
  reload_api: true
  # ---- 直传路由 PUT {base}/blob/{key} 的体积上限（v0.1.30，默认 1GiB）----
  # 与 max_upload_bytes（multipart，默认 10MB）是两套闸，别混。
  blob_upload_max_bytes: 1073741824
  # ---- CORS（v0.1.35）：缺这一段 = 不挂 CORS 层；credentials 必须配显式 origins ----
  cors:
    origins: [] # 留空 = 放行任意源；要带凭据则必须列出具体源
    credentials: false
db:
  default: 'sqlite://db.sqlite' # 相对 config 目录；缺文件自动建空库

# ---- 安装序号（ojm install 每次安装自增一次，作为 reload 热更触发变更——unchanged 判定基于
# config 文档 sha，无落盘变更则热更恒失败。勿删行/勿手工回写旧值。）----
vars:
  ojm_install_seq: 0

# ---- 平台 exec 白名单（ojm install 的解压/迁移两处消费；模板逐字对齐 lifecycle steps 命令构造，
# 不得增删——多一个 token 都会 NotCapable）----
platform:
  # 平台特权模块名单：方案安装器的 reloading 段调 server.reloadConfig 触发热更。
  # 缺这条 → 装在最后一步报 NotCapable: module '_platform' is not platform-privileged。
  modules: [_platform]
  # 受控根 = 后端模块源码根（`src/<name>/api` 的父目录，即 src）。ojm preview 派生 config
  # 时会改写为 dist，保持与 `--api-path` 同源；手写部署请按实际模块根填写。
  root: src
  # ---- U6 信任库加固（P3-1；P2-2 红线 spike 结论）----
  # 威胁：devkit 0.1.75 语义下 fs: 段对全部模块生效（jail = fs.root），且 trusted_paths 只增不减——
  # 信任库落在第三方方案模块可写的 fs.root 内即可被其伪造信任锚。加固须两端配合：
  # ① 本模板已将信任库默认路径移出 modules/ 安装子树（见 _lifecycle 默认 `.solutions/trusted-keys.yaml`，
  #    落在 fs.root 之外的部署根，第三方方案模块 jail 之外）；
  # ② **部署侧**须按 oj 语义补 `platform.trusted_paths`（指向运行时信任库目录，该目录须先存在——
  #    oj 对不存在的 trusted_paths 装配 fail-fast，故不可在模板里硬编码尚未创建的目录）显式授权给
  #    _platform 特权模块写信任库，并收窄第三方方案模块的 fs.root 至其安装子树，方可彻底隔离。
  # 本仓负责①（代码路径）；②属部署/上游配置，留作部署清单项（P3-1 备案，不硬编码以免 oj serve 装配失败）。
  exec:
    _platform:
      allow:
        - 'tar -tvzf ${path:archive}'
        - 'tar -xzf ${path:archive} -C ${path:dest}'
        - 'oj migrate --format json -d ${path:dir} ${raw:module}'

# ---- 方案安装器的落盘面（fs.* 全局）----
# 安装器要解包到 modules/.staging、写 dist/modules、备份 db.sqlite——全在 config 目录内。
# 缺本段 = fs.* 抛 NotCapable，且失败发生在任务文件落盘之前：表现为「POST 安装返回 200、
# 但 task 查询恒 404」，排查成本极高。生产收紧口径见上面 platform 段的 U6 说明
# （fs.root 收窄到安装子树 + third-party 模块 jail 隔离属部署清单项）。
fs:
  root: .
  readonly: false

# ---- LDAP 连接段（D1/PRD §4.5 两段式之连接段；oj 插件严格解析本段，未知键启动 fail-fast——只写下列键）----
# 取消注释并填值即接通目录服务；应用映射段在 DB/设置页（ldap.enabled、ldap_base_dn、
# ldap_uid_attr、ldap_email_attr，group=ldap，即时生效）。本段改动属 restart_pending，需重启。
# ldap:
#  url: "ldap://127.0.0.1:389"
#  bind_dn: ""
#  bind_pw: ""
#  timeout_ms: 3000
#  start_tls: false
#  tls_skip_verify: false
auth:
  jwt_secret: __JWT_SECRET__ # init 随机生成；生产必须更换
  access_token_duration: 2h
  refresh_token_duration: 720h
  anonymous_paths: # auth 端点是业务路由，必须显式匿名（漏列则握手 401，见 ojm 开发手册 §8）
    - /auth/login
    - /auth/ldap-login # D1/AC1-12：LDAP 目录登录（匿名）
    - /auth/refresh
    - /auth/logout
    # 登录页登录方式 Tabs 数据源（C5/AC2-2）：未登录即可读
    - /system/login-methods
