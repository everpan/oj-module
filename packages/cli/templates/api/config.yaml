# oj 服务配置（字段语义见 oj 后端开发手册 oj-api-dev / 或 oj --help）。
# 本文件由 ojm init 生成；config 内相对路径相对本文件所在目录。
# 更多能力见手册 §10：vars / broker / tasks / oidc / ws / html_meta / secrets。

# 站点挂载（oj v0.1.58 起顶层扁平表：一行=一个 URL 前缀+一个目录，api/web 恰好其一）。
# 被删除的 server.api_prefix / app_spa_fallback 已由 mounts 取代；
# ojm dev/preview 的 SPA 深链回落由 ojm 自建静态层负责，无需 oj 的 spa。
mounts:
  - prefix: /api # api 挂载：/api/<module>/...（目录相对 config 所在目录 → api/src）
    api: src
  # 生产若由 oj 直出前端（不走 ojm 静态层），取消下一行注释并先 build 出 web/dist：
  # - prefix: "/"
  #   web: "../web/dist"   # 相对 api/config.yaml → 项目根/web/dist
  #   spa: true
  # 嵌套 handler 组（oj v0.1.64）无需配置开关，组织方式见 api.ts 顶部注释。

server:
  host: 127.0.0.1 # 显式钉死：oj 默认绑 [::1]，localhost 解析序在反代下有坑
  port: 9778
  public_key_path: ./config/public.pem
  certificate_path: ./config/cert.jws
  # ---- 迁移门禁 ----
  # auto = dev 缺省（启动即应用）；release 缺省是 verify（账本落后拒启，先 oj migrate）。
  # 显式写出来：dev 的隐式 DB 副作用不再靠「模式默认值」猜，release 也不会因缺省拒启。
  migrate_on_start: auto
  # ---- 入参契约（v0.1.44）----
  # 契约生成的 .schema 在此生效：违反即 400 且 handler 不执行。
  # 关掉等于退回「后端零校验」，仅在 .schema 与旧 handler 冲突时临时逃生。
  schema_validation: true
  # ---- 单 isolate 堆限额（v0.1.40，默认 256MiB，下限 32MiB）----
  js_heap_limit_bytes: 268435456
  # ---- 路由级超时（v0.1.30）：pattern 按声明序首个命中，且是含 base 的全路径 ----
  route_timeouts: []
  # ---- 统一响应头（v0.1.30）----
  response_headers: {}
  # ---- 热更端点（ojm install 的 reloading 段消费；显式关闭 = 安装器 reloading 段可读失败）----
  # ojm:reload
  reload_api: true
  # ---- 直传路由 PUT {base}/blob/{key} 的体积上限（v0.1.30，默认 1GiB）----
  # 与 max_upload_bytes（multipart，默认 10MB）是两套闸，别混。
  blob_upload_max_bytes: 1073741824
  # ---- CORS（v0.1.35）：缺这一段 = 不挂 CORS 层；credentials 必须配显式 origins ----
  cors:
    origins: [] # 留空 = 放行任意源；要带凭据则必须列出具体源
    credentials: false
db:
  default: 'sqlite://db.sqlite' # 相对 config 目录；缺文件自动建空库

# ---- 安装序号（ojm install 每次安装自增一次，作为 reload 热更触发变更——unchanged 判定基于
# config 文档 sha，无落盘变更则热更恒失败。勿删行/勿手工回写旧值。）----
vars:
  ojm_install_seq: 0

# ---- 平台 exec 白名单（ojm install 的解压/迁移两处消费；模板逐字对齐 lifecycle steps 命令构造，
# 不得增删——多一个 token 都会 NotCapable）----
platform:
  exec:
    _platform:
      allow:
        - 'tar -tvzf ${path:archive}'
        - 'tar -xzf ${path:archive} -C ${path:dest}'
        - 'oj migrate --format json -d ${path:dir} ${raw:module}'

# ---- LDAP 连接段（D1/PRD §4.5 两段式之连接段；oj 插件严格解析本段，未知键启动 fail-fast——只写下列键）----
# 取消注释并填值即接通目录服务；应用映射段在 DB/设置页（ldap.enabled、ldap_base_dn、
# ldap_uid_attr、ldap_email_attr，group=ldap，即时生效）。本段改动属 restart_pending，需重启。
# ldap:
#  url: "ldap://127.0.0.1:389"
#  bind_dn: ""
#  bind_pw: ""
#  timeout_ms: 3000
#  start_tls: false
#  tls_skip_verify: false
auth:
  jwt_secret: __JWT_SECRET__ # init 随机生成；生产必须更换
  access_token_duration: 2h
  refresh_token_duration: 720h
  anonymous_paths: # auth 端点是业务路由，必须显式匿名（漏列则握手 401，见 ojm 开发手册 §8）
    - /auth/login
    - /auth/ldap-login # D1/AC1-12：LDAP 目录登录（匿名）
    - /auth/refresh
    - /auth/logout
    # 登录页登录方式 Tabs 数据源（C5/AC2-2）：未登录即可读
    - /system/login-methods
