name: CI Guard

on:
  push:
    # P7.5 / 评审 P1：此前仅 feature/pkg-*，modularization 的 push 不触发卡口
    branches: [main, modularization, 'feature/*']
  pull_request:
    branches: [main, modularization, 'feature/*']

permissions:
  contents: read

jobs:
  runtime-no-modules:
    name: 'Guard: runtime 不得反向依赖业务模块 #modules'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      # P2.4 卡口：runtime 是框架产物，必须单向被模块依赖。
      # 若 packages/runtime/src 中出现任意对 #modules 的引用（静态 import / 动态 import() /
      # re-export），即视为违反「框架不得反向依赖业务模块」的契约，CI 直接失败。
      # 配套还有 eslint 的 runtime-guard/no-modules-in-runtime 规则（本地提交即拦截），
      # 此处作为 CI 层的硬卡口兜底。
      - name: 运行反向依赖卡口
        run: |
          if grep -rn "#modules" packages/runtime/src; then
            echo "::error::packages/runtime/src 中发现对业务模块 #modules 的反向依赖，已违反 P2.4 卡口"
            exit 1
          fi
          echo "OK: packages/runtime/src 未反向依赖 #modules"

  # P7.5 / 评审 S6：B15 fake 门禁、完整性、契约断言全部在 tests/ 下，
  # 此前无任何 workflow 执行 pnpm test——断言存在却永不运行（§4.8 违约）。
  # 注意必须排在 build 之后：no-fake-in-dist 的产物扫描依赖 build/ 存在。
  test:
    name: 'Test: 契约断言与 fake 门禁（含产物扫描）'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install（锁定 lockfile）
        run: pnpm install --frozen-lockfile
      - name: Build（产物扫描的前置）
        run: pnpm build
      - name: Test
        run: pnpm test
      # cli 包内单元测试（contract/openapi 解析/发射）与根 config 隔离（node 环境、
      # 不收 fake 目录依赖），须显式用其 config 跑——否则 38 条断言永不运行（§4.8 同款违约）
      - name: 'Test: cli 包内单元测试'
        run: pnpm test:cli
