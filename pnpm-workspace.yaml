minimumReleaseAgeExclude:
  - '@redocly/cli@2.51.0'
shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - vite@5.4.21
  - semver@6.3.1

packages:
  - docs
  - packages/*
  - apps/*

allowBuilds:
  esbuild: true
  simple-git-hooks: true

# 共享依赖版本单一真相（设计文档 §4.3 / C4 / D12）。
#
# 宿主（cli 内置 shell-dist）把共享依赖预打包并经 importmap 提供给框架 runtime 与
# 外部模块，它写进 dist/versions.json 的版本是外部工程必须严格相等的对齐基准。
# 一旦宿主与框架各自声明，就会漂移且不报错——实测已漂移到 3 个大版本
# （cssinjs 1.x/2.x、i18next 25/26、react-i18next 16/17），宿主把旧版本当成
# "真相"强加给下游（A25）。此处用 catalog 让两侧只能取同一个值。
#
# 仅收录 SHARED_DEPS（packages/cli/src/shared-deps.ts）内的包 + 少数构建工具。
# 新增共享依赖时：改 SHARED_DEPS → 在此登记 → 各处写 `catalog:`。
# 语法注记：默认 catalog 的键是 `catalog:`；`catalogs:` 是**命名** catalog 的容器，
# 写成 catalogs 会被 pnpm 当成命名 catalog 而报「expected an object」。
catalog:
  '@ant-design/cssinjs': ^2.1.2
  '@ant-design/icons': ^6.2.3
  '@ant-design/pro-components': ^3.1.12-0
  '@antfu/eslint-config': ^9.0.0
  '@commitlint/cli': ^21.0.1
  '@commitlint/config-conventional': ^21.0.1
  '@dnd-kit/core': ^6.3.1
  '@dnd-kit/sortable': ^10.0.0
  '@dnd-kit/utilities': ^3.2.2
  '@eslint-react/eslint-plugin': ^5.7.9
  '@eslint/config-inspector': ^3.0.2
  '@faker-js/faker': ^10.4.0
  '@iconify-json/ri': ^1.2.10
  '@iconify/tools': ^5.0.11
  '@playwright/test': ^1.62.1
  '@redocly/cli': ^2.51.0
  '@svgr/plugin-jsx': ^8.1.0
  '@svgr/plugin-svgo': ^8.1.0
  '@tailwindcss/vite': ^4.3.0
  '@tanstack/react-query': ^5.100.10
  '@tanstack/react-query-devtools': ^5.100.10
  '@testing-library/jest-dom': ^6.9.1
  '@testing-library/react': ^16.3.2
  '@testing-library/user-event': ^14.6.1
  '@types/node': ^25.8.0
  '@types/nprogress': ^0.2.3
  '@types/react': ^19.2.14
  '@types/react-dom': ^19.2.3
  # 构建工具：同样发生过宿主/框架大版本分裂
  '@vitejs/plugin-react': ^6.0.2
  ahooks: ^3.9.7
  antd: ^6.4.2
  antd-img-crop: ^4.30.0
  circular-dependency-scanner: ^3.0.1
  clsx: ^2.1.1
  code-inspector-plugin: ^1.5.1
  dayjs: ^1.11.20
  echarts: ^6.0.0
  echarts-for-react: ^3.0.6
  esbuild: ^0.28.2
  eslint: ^10.4.0
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.2
  globals: ^17.6.0
  happy-dom: ^20.9.0
  i18next: ^26.2.0
  keepalive-for-react: ^5.0.11
  ky: ^2.0.2
  lint-staged: ^17.0.4
  motion: ^12.38.0
  nprogress: ^0.2.0
  pinyin-pro: ^3.28.1
  react: ^19.2.6
  react-countup: ^6.5.3
  react-dom: ^19.2.6
  react-error-boundary: ^6.1.1
  react-i18next: ^17.0.8
  react-jss: ^10.10.0
  react-router: ^7.15.1
  simple-git-hooks: ^2.13.1
  simplebar-react: ^3.3.2
  spin-delay: ^2.0.1
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.0
  taze: ^19.12.0
  tsx: ^4.23.12
  typescript: ^6.0.3
  unplugin-icons: ^23.0.1
  # 外部零直接引用，仅因被多个共享包内嵌而纳入共享表做产物去重（软共享）
  use-sync-external-store: ^1.6.0
  vite: ^8.0.13
  vite-bundle-visualizer: ^1.2.1
  vite-plugin-checker: ^0.13.0
  vite-plugin-fake-server: ^2.2.4
  vite-plugin-svgr: ^5.2.0
  vitepress: ^1.6.4
  vitest: ^4.1.6
  yaml: ^2.9.0
  # AC-D12/AC-D15：契约机制钉 zod v4；非 importmap 共享条目，但 contract 微包、
  # runtime（re-export）、cli（codegen）三处必须同源定版，故纳入 catalog
  zod: ^4.5.4
  zustand: ^5.0.13
